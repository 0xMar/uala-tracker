name: Supabase Keep Alive

on:
  schedule:
    # Every 2 days at 12:00 UTC
    - cron: "0 12 */2 * *"
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://aklthqtwwsqrtvtcnrnc.supabase.co/rest/v1/statements" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "SELECT 1"}' \
            || echo "Request completed (may return 4xx, still counts as activity)"
